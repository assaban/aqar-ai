name: Bug Report
description: Report a bug in Aqar.ai
title: "[BUG]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Pipeline:Ingestion"
        - "Pipeline: Transcription"
        - "Pipeline: LLM Extraction"
        - "Pipeline: Geocoding"
        - "API: Backend"
        - "Web: Frontend"
        - "Mobile: App"
        - "Database"
        - "Infrastructure / Docker"
        - "CI/CD"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs or screenshots
