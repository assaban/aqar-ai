name: Feature Request
description: Propose a new feature for Aqar.ai
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: sprint
    attributes:
      label: Target Sprint
      options:
        - "Sprint 1: Foundation & Scaffold"
        - "Sprint 2: Ingestion Pipeline"
        - "Sprint 3: Transcription Pipeline"
        - "Sprint 4: LLM Extraction"
        - "Sprint 5: Geocoding & Storage"
        - "Sprint 6: API & Search"
        - "Sprint 7: Web Portal"
        - "Sprint 8: Mobile App"
        - "Sprint 9: Quality & Monitoring"
        - "Sprint 10: Deployment & Thesis"
        - "Backlog"
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "As a [role], I want [feature] so that [benefit]"
      placeholder: "As a property seeker, I want to search by neighborhood so that I can find homes near my workplace."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What conditions must be met?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: Critical (MVP blocker)"
        - "P1: High (Sprint goal)"
        - "P2: Medium (Nice to have)"
        - "P3: Low (Future)"
    validations:
      required: true
