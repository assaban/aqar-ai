[project]
name = "aqar-pipeline"
version = "0.1.0"
description = "Aqar.ai AI processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "yt-dlp>=2024.1",
    "openai-whisper>=20231117",
    "anthropic>=0.39",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "aqar-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
include = ["aqar_pipeline*"]
