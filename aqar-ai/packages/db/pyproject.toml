[project]
name = "aqar-db"
version = "0.1.0"
description = "Aqar.ai database models and migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
]

[tool.setuptools.packages.find]
include = ["models*"]
